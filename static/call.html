<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>春雪 · 通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

/* Sakura petal canvas */
#petalCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* === Login Screen === */
#loginScreen {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 18px; padding: 40px;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(255,158,203,0.16) 0%, transparent 55%),
    radial-gradient(ellipse at 82% 88%, rgba(245,208,138,0.10) 0%, transparent 50%),
    linear-gradient(165deg, #2a1a26 0%, #1c1320 55%, #170f1b 100%);
}
#loginScreen h1 {
  font-family: "Songti SC", "STSong", "SimSun", serif;
  color: #ffd9e2; font-size: 34px; font-weight: 600; letter-spacing: 5px;
  text-shadow: 0 0 26px rgba(255,158,203,0.35);
}
#loginScreen h1 em { font-style: normal; color: #f5d08a; }
#loginScreen .subtitle { color: rgba(253,243,234,0.35); font-size: 11px; letter-spacing: 4px; margin-top: -8px; }
#loginScreen .login-card {
  width: 100%; max-width: 340px; margin-top: 14px; padding: 24px 22px 26px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,183,197,0.12);
  border-radius: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
#loginScreen input {
  width: 100%; padding: 13px 16px; border-radius: 12px;
  border: 1px solid rgba(255,183,197,0.14); background: rgba(255,255,255,0.05);
  color: #fdf3ea; font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s;
}
#loginScreen input:focus { border-color: #ff9ecb; box-shadow: 0 0 0 3px rgba(255,158,203,0.12); }
#loginScreen input::placeholder { color: rgba(253,243,234,0.28); }
#loginScreen button {
  margin-top: 4px; padding: 14px 0; width: 100%; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #ff9ecb 0%, #f5d08a 100%);
  color: #2a1a26; font-size: 16px; font-weight: 700; letter-spacing: 4px;
  cursor: pointer; transition: transform .15s, opacity .2s, box-shadow .2s;
  box-shadow: 0 6px 24px rgba(255,158,203,0.25);
}
#loginScreen button:active { transform: scale(0.97); }
#loginScreen button:disabled { opacity: 0.5; }
.login-error { color: #ff7a8a; font-size: 13px; min-height: 18px; text-align: center; }

/* === Call Screen === */
#callScreen { display: none; flex-direction: column; height: 100%; position: relative; z-index: 1;
  background:
    radial-gradient(ellipse at 50% 28%, rgba(255,158,203,0.10) 0%, transparent 55%),
    linear-gradient(170deg, #2a1a26 0%, #1c1320 55%, #170f1b 100%);
}
#callScreen.active { display: flex; }

/* Top bar */
.top-bar { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); }
.top-bar .back-btn { color: rgba(253,243,234,0.45); font-size: 16px; cursor: pointer; background: none; border: none; letter-spacing: 1px; }
.top-bar .timer { color: rgba(253,243,234,0.35); font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: 1px; }

/* Status area */
.status-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.avatar-ring {
  width: 150px; height: 150px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 26px;
}
.avatar-ring::before {
  content: ''; position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(from 0deg, #ff9ecb, #f5d08a, #ffd9e2, #ff9ecb);
  animation: spin 3s linear infinite; opacity: 0.55;
  filter: blur(1px);
}
.avatar-ring::after {
  content: ''; position: absolute; inset: -14px; border-radius: 50%;
  border: 1px solid rgba(255,158,203,0.25);
  animation: breathe 3.2s ease-in-out infinite;
}
.avatar-ring.idle::before { animation: none; opacity: 0.12; }
.avatar-ring.idle::after { animation: none; opacity: 0.4; }
.avatar-ring.speaking::before { animation-duration: 1.4s; opacity: 1; }
.avatar-inner {
  width: 140px; height: 140px; border-radius: 50%; position: relative; z-index: 1;
  background: radial-gradient(circle at 35% 30%, #3a2434, #241826 70%);
  border: 1px solid rgba(255,183,197,0.15);
  display: flex; align-items: center; justify-content: center;
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 58px; color: #ffd9e2;
  text-shadow: 0 0 18px rgba(255,158,203,0.5);
  user-select: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.06); opacity: 0.15; } }

.status-text { color: #ffd9e2; font-size: 18px; font-weight: 500; min-height: 26px; transition: opacity .3s; letter-spacing: 1px; }
.status-sub { color: rgba(253,243,234,0.3); font-size: 12px; min-height: 16px; letter-spacing: 1px; }

/* Audio visualizer bars */
.viz-container { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 40px; margin-top: 16px; }
.viz-bar { width: 3px; background: rgba(255,158,203,0.25); border-radius: 2px; height: 4px; transition: height .08s; }
.viz-container.active .viz-bar { background: linear-gradient(to top, #f5d08a, #ff9ecb); }

/* Audio volume controls */
.audio-controls { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 0 24px 6px; }
.vol-control { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.vol-icon { color: rgba(253,243,234,0.45); width: 20px; text-align: center; display: flex; justify-content: center; }
.vol-control input[type="range"] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.14); outline: none; cursor: pointer;
}
.vol-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: linear-gradient(135deg, #ff9ecb, #f5d08a); border: 2px solid #2a1a26; cursor: pointer;
  box-shadow: 0 0 8px rgba(255,158,203,0.4); transition: transform .15s;
}
.vol-control input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.25); }
.vol-control input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: linear-gradient(135deg, #ff9ecb, #f5d08a); border: 2px solid #2a1a26; cursor: pointer;
}
.vol-val { color: rgba(253,243,234,0.4); font-size: 11px; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.vol-control.muted .vol-icon { color: rgba(253,243,234,0.18); }
.vol-control.muted input[type="range"] { background: rgba(255,255,255,0.05); }

/* Bottom controls */
.controls { padding: 30px 20px max(30px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 44px; }
.mic-btn {
  width: 66px; height: 66px; border-radius: 50%; border: 1px solid rgba(255,183,197,0.18); cursor: pointer;
  background: rgba(255,255,255,0.05); color: rgba(253,243,234,0.55);
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; position: relative;
}
.mic-btn.listening { background: rgba(255,158,203,0.14); border-color: rgba(255,158,203,0.35); color: #ff9ecb; }
.mic-btn.listening::after {
  content: ''; position: absolute; width: 66px; height: 66px; border-radius: 50%;
  border: 2px solid rgba(255,158,203,0.35); animation: pulse 2s ease-out infinite;
}
.mic-btn .ic-off { display: none; }
.mic-btn.off { color: rgba(253,243,234,0.25); border-color: rgba(255,183,197,0.08); }
.mic-btn.off .ic-on { display: none; }
.mic-btn.off .ic-off { display: flex; }
.hangup-btn {
  width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, #e85d75, #ff8a80); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(232,93,117,0.35);
  transition: transform .15s; position: relative;
}
.hangup-btn:active { transform: scale(0.92); }
@keyframes pulse {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.55); opacity: 0; }
}

/* Transcript */
.transcript { position: absolute; bottom: 132px; left: 16px; right: 16px;
  display: flex; flex-direction: column; gap: 6px; pointer-events: auto; max-height: 260px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: rgba(255,158,203,0.3) transparent; }
.transcript::-webkit-scrollbar { width: 4px; }
.transcript::-webkit-scrollbar-thumb { background: rgba(255,158,203,0.3); border-radius: 2px; }
.transcript-item { font-size: 14px; line-height: 1.5; padding: 9px 14px; border-radius: 14px; max-width: 85%; word-break: break-word; }
.transcript-item.user { align-self: flex-end; background: rgba(255,158,203,0.14); color: #ffd9e2; }
.transcript-item.bot { align-self: flex-start; background: rgba(255,255,255,0.06); color: rgba(253,243,234,0.75); }

/* Interrupt hint */
.interrupt-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 84px);
  color: rgba(253,243,234,0.25); font-size: 12px; display: none; letter-spacing: 1px; }
.interrupt-hint.show { display: block; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Mic level meter */
.mic-level { display: flex; align-items: center; gap: 8px; width: 180px; margin: 4px auto 0; opacity: .75; }
.mic-level-track { flex: 1; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.mic-level-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f5d08a, #ff9ecb); border-radius: 2px; transition: width .06s linear; }
.mic-level-val { font-size: 10px; color: rgba(253,243,234,.55); font-family: ui-monospace, monospace; min-width: 38px; text-align: right; }

/* Debug line */
.debug-line { font-size: 10px; color: rgba(253,243,234,.35); font-family: ui-monospace, monospace; margin-top: 2px; min-height: 12px; text-align: center; }
</style>
</head>
<body>

<!-- Sakura petal canvas -->
<canvas id="petalCanvas"></canvas>

<!-- Login Screen -->
<div id="loginScreen">
  <h1>春雪<em>·</em>通话</h1>
  <div class="subtitle">V O I C E  C A L L</div>
  <div class="login-card">
    <input id="username" placeholder="用户名" value="" autofocus>
    <input id="password" type="password" placeholder="密码" value="">
    <div class="login-error" id="loginError"></div>
    <button id="loginBtn" onclick="doLogin()">连 接</button>
  </div>
</div>

<!-- Call Screen -->
<div id="callScreen">
  <div class="top-bar">
    <button class="back-btn" onclick="hangUp()">‹ 返回</button>
    <div class="timer" id="callTimer">00:00</div>
  </div>

  <div class="status-area">
    <div class="avatar-ring idle" id="avatarRing">
      <div class="avatar-inner">雪</div>
    </div>
    <div class="status-text" id="statusText">正在连接...</div>
    <div class="status-sub" id="statusSub"></div>
    <div class="viz-container" id="vizContainer"></div>
    <div class="mic-level">
      <div class="mic-level-track"><div class="mic-level-bar" id="micLevelBar"></div></div>
      <span class="mic-level-val" id="micLevelVal">0.000</span>
    </div>
    <div class="debug-line" id="debugLine"></div>
  </div>

  <div class="transcript" id="transcript"></div>
  <div class="interrupt-hint" id="interruptHint">轻触屏幕可打断</div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" onclick="toggleMute()">
      <span class="ic ic-on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg></span>
      <span class="ic ic-off"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 11.5 5.5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="3" y1="3" x2="21" y2="21"/></svg></span>
    </button>
    <button class="hangup-btn" onclick="hangUp()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    <button class="mic-btn" id="speakerBtn" onclick="toggleSpeaker()">
      <span class="ic ic-on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
      <span class="ic ic-off"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg></span>
    </button>
  </div>
  <div class="audio-controls" id="audioControls" style="display:none">
    <div class="vol-control" id="micVolControl">
      <span class="vol-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg></span>
      <input type="range" id="micVol" min="0" max="200" value="100" oninput="setMicVolume(this.value)">
      <span class="vol-val" id="micVolVal">100</span>
    </div>
    <div class="vol-control" id="speakerVolControl">
      <span class="vol-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
      <input type="range" id="speakerVol" min="0" max="100" value="100" oninput="setSpeakerVolume(this.value)">
      <span class="vol-val" id="speakerVolVal">100</span>
    </div>
  </div>
</div>

<script>

// ============================================================
// Sakura petals (春雪 signature)
// ============================================================
(function() {
  const canvas = document.getElementById('petalCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let petals = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const COLORS = ['#ffb7c5', '#ff9ecb', '#f5d08a', '#ffd9e2'];
  function Petal() { this.reset(true); }
  Petal.prototype.reset = function(anywhere) {
    this.x = Math.random() * canvas.width;
    this.y = anywhere ? Math.random() * canvas.height : -20;
    this.size = 4 + Math.random() * 6;
    this.speedY = 0.4 + Math.random() * 1.1;
    this.speedX = -0.35 + Math.random() * 0.7;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = -0.02 + Math.random() * 0.04;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.opacity = 0.3 + Math.random() * 0.45;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.01 + Math.random() * 0.03;
  };
  Petal.prototype.update = function() {
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.wobble) * 0.4;
    this.wobble += this.wobbleSpeed;
    this.rot += this.rotSpeed;
    if (this.y > canvas.height + 20 || this.x < -30 || this.x > canvas.width + 30) this.reset(false);
  };
  Petal.prototype.draw = function() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size * 0.45, this.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };
  for (let i = 0; i < 20; i++) petals.push(new Petal());
  (function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < petals.length; i++) { petals[i].update(); petals[i].draw(); }
    requestAnimationFrame(loop);
  })();
})();

// ============================================================
// State
// ============================================================
let ws = null;
let audioCtx = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;
let analyserNode = null;
let vadState = 'idle'; // idle | listening | speaking | processing | responding
let callStartTime = 0;
let timerInterval = null;
let isMuted = false;
let isSpeakerMuted = false;
let micGainNode = null;

// VAD config
const VAD_THRESHOLD = 0.008;     // RMS threshold (balanced: catches quiet speech, filters noise)
const VAD_SILENCE_MS = 2000;     // 2s pause = sentence done (was 800ms — don't cut mid-sentence!)
const VAD_MIN_SPEECH_MS = 500;   // Min speech duration to count
const PCM_SAMPLE_RATE = 16000;
const CHUNK_SIZE = 4096;

// Audio buffer
let audioChunks = [];
let vadCheckInterval = null;
let speechStartTime = 0;
let lastVoiceTime = 0;
let isCurrentlySpeaking = false;

// Response audio
let responseChunks = [];
let currentAudioSource = null;
let playQueue = [];       // queue of {url} to play sequentially
let isPlaying = false;

// ============================================================
// Login
// ============================================================
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  btn.disabled = true;
  errEl.textContent = '';

  // Pre-create AudioContext inside user gesture so autoplay policy won't suspend it
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: PCM_SAMPLE_RATE });
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { console.warn('[Call] pre-create AudioContext failed', e); }
  }

  const SERVER_URL = window.location.origin;
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    errEl.textContent = '请输入用户名和密码';
    btn.disabled = false;
    return;
  }

  try {
    const resp = await fetch(SERVER_URL + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password, trust_device_flag: true })
    });
    const data = await resp.json();
    console.log('[Call] Login response:', JSON.stringify(data));
    const token = data?.data?.token || data?.data?.jwt_token;
    if (!resp.ok || !token) {
      errEl.textContent = data.message || '登录失败';
      btn.disabled = false;
      return;
    }
    // Store credentials
    sessionStorage.setItem('call_token', token);
    sessionStorage.setItem('call_server', SERVER_URL);
    startCall(SERVER_URL, token);
  } catch (e) {
    errEl.textContent = '连接失败: ' + e.message;
    btn.disabled = false;
  }
}

// ============================================================
// Start Call
// ============================================================
async function startCall(serverUrl, token) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('callScreen').classList.add('active');
  document.getElementById('audioControls').style.display = 'flex';
  document.getElementById('speakerBtn').classList.add('listening');
  setStatus('正在连接...', '');

  // Connect WebSocket
  const wsUrl = serverUrl.replace(/^http/, 'ws') + '/api/live_chat/ws?token=' + encodeURIComponent(token);
  ws = new WebSocket(wsUrl);

  ws.onopen = async () => {
    console.log('[Call] WebSocket connected');
    setStatus('正在获取麦克风...', '');
    try {
      await initAudio();
      setStatus('正在听你说话', '说吧～老婆在听');
      startVAD();
      startTimer();
    } catch (e) {
      setStatus('麦克风获取失败', e.message);
    }
  };

  ws.onmessage = (event) => {
    handleWSMessage(JSON.parse(event.data));
  };

  ws.onerror = (e) => {
    console.error('[Call] WS error', e);
    setStatus('连接断开', '');
  };

  ws.onclose = () => {
    console.log('[Call] WS closed');
    if (vadState !== 'idle') {
      setStatus('连接已断开', '');
    }
  };

  // Tap to interrupt
  document.getElementById('callScreen').addEventListener('click', (e) => {
    if (vadState === 'responding' && !e.target.closest('button')) {
      doInterrupt();
    }
  });
}

// ============================================================
// Audio Init
// ============================================================
async function initAudio() {
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      sampleRate: PCM_SAMPLE_RATE,
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    }
  });

  // Reuse context created during login click (user gesture), else create now
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: PCM_SAMPLE_RATE });
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch (e) {}
  }

  // Fallback: any click on page wakes the context (autoplay policy workaround)
  document.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  sourceNode = audioCtx.createMediaStreamSource(mediaStream);

  // Mic gain (independent from speaker volume)
  micGainNode = audioCtx.createGain();
  micGainNode.gain.value = 1.0;
  sourceNode.connect(micGainNode);

  // Analyser for VAD
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 512;
  analyserNode.smoothingTimeConstant = 0.3;
  micGainNode.connect(analyserNode);

  // ScriptProcessor for PCM capture
  processorNode = audioCtx.createScriptProcessor(CHUNK_SIZE, 1, 1);
  processorNode.onaudioprocess = onAudioProcess;
  micGainNode.connect(processorNode);
  processorNode.connect(audioCtx.destination); // needed for some browsers

  // Init visualizer
  initVisualizer();
}

function onAudioProcess(e) {
  if (isMuted || vadState === 'processing' || vadState === 'responding') return;

  const input = e.inputBuffer.getChannelData(0);

  // Resample to 16kHz if AudioContext didn't honor the requested rate
  const srcRate = audioCtx.sampleRate;
  const audioData = (srcRate && srcRate !== PCM_SAMPLE_RATE)
    ? resampleTo16k(input, srcRate)
    : input;

  // Convert Float32 → Int16 PCM
  const pcm16 = new Int16Array(audioData.length);
  for (let i = 0; i < audioData.length; i++) {
    const s = Math.max(-1, Math.min(1, audioData[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }

  if (isCurrentlySpeaking) {
    // Buffer audio during speech
    audioChunks.push(pcm16.buffer);
  }
}

// Linear-interpolation resample to 16kHz
function resampleTo16k(input, srcRate) {
  const ratio = srcRate / PCM_SAMPLE_RATE;
  const outLen = Math.floor(input.length / ratio);
  const output = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const srcIdx = i * ratio;
    const idx0 = Math.floor(srcIdx);
    const idx1 = Math.min(idx0 + 1, input.length - 1);
    const frac = srcIdx - idx0;
    output[i] = input[idx0] * (1 - frac) + input[idx1] * frac;
  }
  return output;
}

// ============================================================
// VAD (Voice Activity Detection)
// ============================================================
function startVAD() {
  vadState = 'listening';   // ★ KEY FIX: enter listening immediately — previously stayed 'idle' so VAD never ran until the first reply finished playing!
  isCurrentlySpeaking = false;
  audioChunks = [];
  speechStartTime = 0;
  lastVoiceTime = 0;

  const dataArray = new Uint8Array(analyserNode.frequencyBinCount);

  vadCheckInterval = setInterval(() => {
    if (vadState !== 'listening' && vadState !== 'speaking' && vadState !== 'processing' && vadState !== 'responding') return;

    analyserNode.getByteTimeDomainData(dataArray);

    // Calculate RMS
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = (dataArray[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / dataArray.length);

    // Update visualizer
    updateVisualizer(rms);

    const now = Date.now();

    // ★ INTERRUPT: user keeps talking while bot is processing → interrupt & re-capture
    // (fixes "长话被截断": the tail of a long sentence was dropped during 'processing')
    if (vadState === 'processing' && rms > VAD_THRESHOLD) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ t: 'interrupt' }));
      }
      vadState = 'speaking';
      isCurrentlySpeaking = true;
      speechStartTime = now;
      lastVoiceTime = now;
      audioChunks = [];
      setStatus('正在听你说话', '');
      document.getElementById('avatarRing').classList.remove('idle');
      return;
    }

    if (vadState === 'responding') {
      // ★ While the bot is speaking, if the user starts talking, interrupt
      // and switch to capture. Also acts as a safety net: if audio playback
      // ever gets stuck, the user's voice always breaks through.
      if (rms > VAD_THRESHOLD) {
        window._voiceHitCount = (window._voiceHitCount || 0) + 1;
        if (window._voiceHitCount >= 3) {   // ~240ms of continuous voice
          window._voiceHitCount = 0;
          console.log('[Call] User voice during playback -> interrupt');
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ t: 'interrupt' }));
          }
          stopPlayback();
          vadState = 'speaking';
          isCurrentlySpeaking = true;
          speechStartTime = now;
          lastVoiceTime = now;
          audioChunks = [];
          setStatus('正在听你说话', '');
          document.getElementById('avatarRing').classList.remove('idle');
        }
      } else {
        window._voiceHitCount = 0;
      }
      return;
    }

    if (vadState === 'processing') return;

    if (rms > VAD_THRESHOLD) {
      // Voice detected
      if (!isCurrentlySpeaking) {
        isCurrentlySpeaking = true;
        speechStartTime = now;
        vadState = 'speaking';
        setStatus('正在听你说话', '');
        document.getElementById('avatarRing').classList.remove('idle');
      }
      lastVoiceTime = now;
    } else {
      // Silence
      if (isCurrentlySpeaking && (now - lastVoiceTime) > VAD_SILENCE_MS) {
        const speechDuration = now - speechStartTime;
        if (speechDuration >= VAD_MIN_SPEECH_MS) {
          // Speech ended → send audio
          isCurrentlySpeaking = false;
          sendAudio();
        } else {
          // Too short, reset
          isCurrentlySpeaking = false;
          audioChunks = [];
          vadState = 'listening';
          setStatus('正在听你说话', '说吧～老婆在听');
        }
      }
    }
  }, 80);
}

// ============================================================
// Send Audio via WebSocket
// ============================================================
function sendAudio() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (audioChunks.length === 0) return;

  vadState = 'processing';
  setStatus('春雪正在思考...', '');
  document.getElementById('avatarRing').classList.remove('idle');

  // Safety timeout: if server never replies (e.g. STT returned empty),
  // reset to listening so the call doesn't get stuck forever.
  clearTimeout(window._processingTimeout);
  window._processingTimeout = setTimeout(() => {
    if (vadState === 'processing') {
      console.warn('[Call] No response within 10s, resetting to listening');
      addTranscript('bot', '（老婆没听清，再说一次吧～）');
      resetToListening();
    }
  }, 10000);

  const stamp = Date.now().toString();

  // Start speaking
  ws.send(JSON.stringify({ t: 'start_speaking', stamp }));

  // Send audio chunks
  let offset = 0;
  const sendChunks = () => {
    if (offset >= audioChunks.length) {
      // End speaking
      ws.send(JSON.stringify({ t: 'end_speaking', stamp }));
      audioChunks = [];
      return;
    }
    const chunk = audioChunks[offset];
    const base64 = arrayBufferToBase64(chunk);
    ws.send(JSON.stringify({ t: 'speaking_part', data: base64 }));
    offset++;
    // Use setTimeout to avoid blocking, send in small batches
    if (offset % 5 === 0) {
      setTimeout(sendChunks, 1);
    } else {
      sendChunks();
    }
  };
  sendChunks();
}

// ============================================================
// Handle WebSocket Messages
// ============================================================
function handleWSMessage(msg) {
  switch (msg.t) {
    case 'user_msg':
      // STT result - what user said
      addTranscript('user', msg.data.text);
      break;

    case 'bot_text_chunk':
      // LLM text chunk — stream into subtitle live
      if (!window._currentBotText) {
        window._currentBotText = '';
      }
      window._currentBotText += msg.data.text;
      updateBotTranscript(window._currentBotText);
      break;

    case 'bot_text_full':
      // Complete bot text (always sent by backend, even with audio)
      window._currentBotText = msg.data.text || '';
      updateBotTranscript(window._currentBotText);
      break;

    case 'bot_msg':
      // Text-only bot reply (no audio path)
      window._currentBotText = msg.data.text || '';
      updateBotTranscript(window._currentBotText);
      break;

    case 'response':
      // Audio chunk (base64)
      clearTimeout(window._processingTimeout);
      responseChunks.push(msg.data);
      if (vadState !== 'responding') {
        vadState = 'responding';
        setStatus('春雪正在说话', '');
        document.getElementById('avatarRing').classList.add('speaking');
        document.getElementById('interruptHint').classList.add('show');
      }
      break;

    case 'metrics':
      // Optional: show timing
      if (msg.data.llm_ttft) {
        console.log('[Call] LLM TTFT:', msg.data.llm_ttft, 'ms');
      }
      break;

    case 'stop_play':
      // Interrupted
      console.log('[Call] Interrupted');
      stopPlayback();
      break;

    case 'error':
      console.error('[Call] Error:', msg.data);
      setStatus('出错了', msg.data);
      clearTimeout(window._processingTimeout);
      // Reset to listening
      setTimeout(() => {
        if (vadState === 'processing' || vadState === 'responding') {
          resetToListening();
        }
      }, 2000);
      break;

    case 'complete':
    case 'end':
      // Response complete → play audio (subtitle already shown via bot_text_full/chunks)
      console.log('[Call] Response complete');
      window._currentBotText = '';
      window._botTranscriptItem = null;
      playResponseAudio();
      break;
  }
}

// ============================================================
// Play Response Audio
// ============================================================
function playResponseAudio() {
  if (responseChunks.length === 0) {
    resetToListening();
    return;
  }

  // Each chunk from the backend is an INDEPENDENT complete audio file
  // (WAV with its own RIFF header). Concatenating them into one blob
  // makes the player stop at the first chunk's data size — so only the
  // first sentence is heard. Fix: play chunks sequentially.
  for (const b64 of responseChunks) {
    try {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      // Detect format: check WAV/MP3 header
      let mimeType = 'audio/wav';
      if (bytes.length > 3) {
        const header = String.fromCharCode(bytes[0], bytes[1], bytes[2]);
        if (header === 'ID3' || (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0)) {
          mimeType = 'audio/mpeg';
        }
      }
      const blob = new Blob([bytes], { type: mimeType });
      playQueue.push({ url: URL.createObjectURL(blob) });
    } catch (e) {
      console.error('[Call] Bad audio chunk', e);
    }
  }
  responseChunks = [];

  if (playQueue.length === 0) {
    clearTimeout(window._playTimeout);
    resetToListening();
    return;
  }
  isPlaying = true;
  playNextInQueue();
}

function playNextInQueue() {
  if (!isPlaying || playQueue.length === 0) {
    // Queue exhausted → done
    isPlaying = false;
    playQueue.forEach(item => URL.revokeObjectURL(item.url));
    playQueue = [];
    resetToListening();
    return;
  }

  const item = playQueue.shift();
  const audio = new Audio(item.url);
  currentAudioSource = audio;

  // Safety net: if onended/onerror never fires (e.g. decoding quirk), force
  // advance after a generous timeout so the state machine never locks.
  clearTimeout(window._playTimeout);
  window._playTimeout = setTimeout(() => {
    console.warn('[Call] Playback timeout, skipping to next chunk');
    URL.revokeObjectURL(item.url);
    if (currentAudioSource === audio) currentAudioSource = null;
    playNextInQueue();
  }, 30000);

  // Apply speaker volume (independent from mic)
  const speakerVol = parseInt(document.getElementById('speakerVol').value || '100', 10) / 100;
  audio.volume = isSpeakerMuted ? 0 : speakerVol;

  const finishChunk = () => {
    clearTimeout(window._playTimeout);
    URL.revokeObjectURL(item.url);
    if (currentAudioSource === audio) currentAudioSource = null;
    playNextInQueue();
  };

  audio.onended = finishChunk;
  audio.onerror = (e) => {
    console.error('[Call] Audio play error', e);
    finishChunk();
  };

  audio.play().catch(e => {
    console.error('[Call] Play failed', e);
    finishChunk();
  });
}

function stopPlayback() {
  clearTimeout(window._playTimeout);
  isPlaying = false;
  if (currentAudioSource) {
    currentAudioSource.pause();
    currentAudioSource = null;
  }
  playQueue.forEach(item => URL.revokeObjectURL(item.url));
  playQueue = [];
  responseChunks = [];
  resetToListening();
}

function resetToListening() {
  vadState = 'listening';
  setStatus('正在听你说话', '说吧～老婆在听');
  document.getElementById('avatarRing').classList.remove('speaking');
  document.getElementById('avatarRing').classList.add('idle');
  document.getElementById('interruptHint').classList.remove('show');
}

// ============================================================
// Interrupt
// ============================================================
function doInterrupt() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ t: 'interrupt' }));
  }
  stopPlayback();
}

// ============================================================
// Mute toggle
// ============================================================
function toggleMute() {
  isMuted = !isMuted;
  const btn = document.getElementById('micBtn');
  if (isMuted) {
    btn.classList.remove('listening');
    btn.classList.add('off');
  } else {
    btn.classList.add('listening');
    btn.classList.remove('off');
  }
}

// ============================================================
// Speaker mute toggle
// ============================================================
function toggleSpeaker() {
  isSpeakerMuted = !isSpeakerMuted;
  const btn = document.getElementById('speakerBtn');
  const volControl = document.getElementById('speakerVolControl');
  if (isSpeakerMuted) {
    btn.classList.remove('listening');
    btn.classList.add('off');
    volControl.classList.add('muted');
  } else {
    btn.classList.add('listening');
    btn.classList.remove('off');
    volControl.classList.remove('muted');
  }
  // Apply immediately to playing audio
  if (currentAudioSource) {
    const speakerVol = parseInt(document.getElementById('speakerVol').value || '100', 10) / 100;
    currentAudioSource.volume = isSpeakerMuted ? 0 : speakerVol;
  }
}

// ============================================================
// Volume controls (mic & speaker independent)
// ============================================================
function setMicVolume(value) {
  const v = parseInt(value, 10) || 0;
  document.getElementById('micVolVal').textContent = v;
  if (micGainNode) {
    micGainNode.gain.value = v / 100;
  }
}

function setSpeakerVolume(value) {
  const v = parseInt(value, 10) || 0;
  document.getElementById('speakerVolVal').textContent = v;
  if (currentAudioSource) {
    currentAudioSource.volume = isSpeakerMuted ? 0 : v / 100;
  }
}

// ============================================================
// Hang Up
// ============================================================
function hangUp() {
  if (vadCheckInterval) clearInterval(vadCheckInterval);
  if (timerInterval) clearInterval(timerInterval);
  if (currentAudioSource) currentAudioSource.pause();
  if (ws) { ws.close(); ws = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }

  vadState = 'idle';
  document.getElementById('callScreen').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginBtn').disabled = false;
}

// ============================================================
// Helpers
// ============================================================
function setStatus(text, sub) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusSub').textContent = sub || '';
}

function startTimer() {
  callStartTime = Date.now();
  timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = m + ':' + s;
  }, 1000);
}

function addTranscript(role, text) {
  const container = document.getElementById('transcript');
  const item = document.createElement('div');
  item.className = 'transcript-item ' + role;
  item.textContent = text;
  container.appendChild(item);
  // Keep a scrollable history (trim only very old items)
  while (container.children.length > 50) {
    container.removeChild(container.firstChild);
  }
  container.scrollTop = container.scrollHeight;
}

// Live-update the current bot subtitle (streaming chunks → final full text)
function updateBotTranscript(text) {
  const container = document.getElementById('transcript');
  let item = window._botTranscriptItem;
  if (!item || !document.body.contains(item)) {
    item = document.createElement('div');
    item.className = 'transcript-item bot';
    container.appendChild(item);
    window._botTranscriptItem = item;
  }
  item.textContent = text;
  container.scrollTop = container.scrollHeight;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk) {
    const slice = bytes.subarray(i, Math.min(i + chunk, bytes.length));
    binary += String.fromCharCode.apply(null, slice);
  }
  return btoa(binary);
}

// Visualizer
function initVisualizer() {
  const container = document.getElementById('vizContainer');
  for (let i = 0; i < 24; i++) {
    const bar = document.createElement('div');
    bar.className = 'viz-bar';
    container.appendChild(bar);
  }
}

function updateVisualizer(rms) {
  const container = document.getElementById('vizContainer');
  const bar = document.getElementById('micLevelBar');
  const val = document.getElementById('micLevelVal');
  if (bar) {
    const pct = Math.min(100, (rms / 0.05) * 100);
    bar.style.width = pct + '%';
    bar.style.background = rms > VAD_THRESHOLD
      ? 'linear-gradient(90deg, #f5d08a, #ff9ecb)'
      : 'linear-gradient(90deg, #ffb7c5, #f5d08a)';
  }
  if (val) val.textContent = rms.toFixed(4);
  const bars = document.querySelectorAll('.viz-bar');
  if (vadState === 'listening' || vadState === 'speaking') {
    container.classList.add('active');
  } else {
    container.classList.remove('active');
  }
  // Real mic spectrum (not fake wave)
  if (!window._freqData) window._freqData = new Uint8Array(analyserNode.frequencyBinCount);
  analyserNode.getByteFrequencyData(window._freqData);
  const n = bars.length;
  const step = Math.max(1, Math.floor((window._freqData.length * 0.55) / n));
  for (let i = 0; i < n; i++) {
    const v = window._freqData[i * step] / 255;
    const height = Math.max(2, Math.pow(v, 1.6) * 38);
    bars[i].style.height = height + 'px';
  }
}

// Enter key to login
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
