  SKILL.md 工具决策树，TencentDB Agent Memory 对标分析（RRF/Offload已实现✅）。
  知识毕业系统：从错误教训到永久知识的完整生命周期。
  LLM 可直接调用记忆数据库，所有工具返回自然语言摘要。
