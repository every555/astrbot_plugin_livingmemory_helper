name: astrbot_plugin_livingmemory_helper
desc: >
  LivingMemory 辅助增强插件 v6.2 — RRF 融合检索 + 上下文卸载 + 核心记忆索引、图增强召回、
  会话摘要(Summary)、知识图谱、梦境引擎、
  间隔重复强化引擎、上下文感知情感分析、知识毕业系统。
